<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Pollo Loco</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./img/4_enemie_boss_chicken/1_walk/G1.png" />

  <!-- JS Model Files -->
  <script src="models/drawable.class.js"></script>
  <script src="models/movable-object.class.js"></script>
  <script src="models/endboss.class.js"></script>
  <script src="models/coins.class.js"></script>
  <script src="models/bottle.class.js"></script>
  <script src="models/status.class.js"></script>
  <script src="models/coinsStatus.class.js"></script>
  <script src="models/bottlesStatusBar.class.js"></script>
  <script src="models/endbossStatus.class.js"></script>
  <script src="models/character.class.js"></script>
  <script src="models/chicken.class.js"></script>
  <script src="models/chicken-small.class.js"></script>
  <script src="models/cloud.class.js"></script>
  <script src="models/background-object.class.js"></script>
  <script src="models/world.class.js"></script>
  <script src="models/keyboard.class.js"></script>
  <script src="models/level.class.js"></script>
  <script src="models/throwable.class.js"></script>

  <!-- Level Definition -->
  <script src="levels/level1.js"></script>

  <!-- Game Logic -->
  <script src="js/game.js"></script>
</head>

<body>
  <h1 id="gameTitel">El Pollo Loco</h1>

  <!-- Start Menu -->
  <div id="startMenu">
    <div id="menuWrapper">
      <img id="menuImage" src="./img/9_intro_outro_screens/start/startscreen_2.png" alt="Start Menu Image" />
      <button id="startButton" onclick="startGame()">Start Game</button>

      <!-- Settings Icon and Info Button -->
      <img id="soundIcon" src="./img/11-menu/settings_icon.png" alt="Settings Icon">
      <button id="infoButton" class="info-button">ℹ</button>

      <!-- Controls Info (Hidden by Default) -->
      <div id="controlDiv" class="hidden">
        <h3>🎮 Game Controls</h3>
        <p>⬅️ / ➡️ — Move Left / Right</p>
        <p>⬆️ — Jump</p>
        <p>D — Throw Salsa</p>
      </div>

      <!-- Sound and Display Settings -->
      <div class="sound-menu">
        <div>
          Fullscreen
          <img id="fullscreen-switch" src="./img/11-menu/switch_off.png" alt="Fullscreen Switch">
        </div>
        <div>
          Sounds
          <img id="sound-switch" src="./img/11-menu/switch_on.png" alt="Sound Switch">
        </div>
        <div>
          Music
          <img id="music-switch" src="./img/11-menu/switch_on.png" alt="Music Switch">
        </div>
        <img class="close-icon" src="./img/11-menu/close_icon.png" alt="Close Settings">
      </div>
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="gameContainer">
    <canvas id="canvas" width="720" height="500"></canvas>

    <!-- Mobile Touch Controls (Hidden on Desktop) -->
    <div id="bottomPanel" class="mobile-controls hidden">
      <button id="btnLeft" class="control-button">
        <img src="./img/10-mobile/arrow_left.png" alt="Left" />
      </button>
      <button id="btnRight" class="control-button">
        <img src="./img/10-mobile/arrow_right.png" alt="Right" />
      </button>
      <button id="btnJump" class="control-button">
        <img id="btnJumpImg" src="./img/10-mobile/arrow_up.png" alt="Jump" />
      </button>
      <button id="btnThrow" class="control-button">
        <img src="./img/10-mobile/salsa_bottle.png" alt="Throw" />
      </button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden">
      <img id="gameOverImage" src="" alt="Game Over" />
      <div id="gameOverButtons">
        <button id="restartButton">Retry</button>
        <button id="backToMenuButton">Back to Menu</button>
      </div>
    </div>

    <!-- Orientation Warning for Mobile -->
    <div id="orientationWarning" class="hidden">
      <h2>PLEASE ROTATE YOUR DEVICE TO PLAY</h2>
      <svg id="deviceIcon" xmlns="http://www.w3.org/2000/svg" height="16" width="12" viewBox="0 0 384 512">
        <path fill="#ffd111"
          d="M16 64C16 28.7 44.7 0 80 0H304c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H80c-35.3 0-64-28.7-64-64V64zM144 448c0 8.8 7.2 16 16 16h64c8.8 0 16-7.2 16-16s-7.2-16-16-16H160c-8.8 0-16 7.2-16 16zM304 64H80V384H304V64z">
        </path>
      </svg>
    </div>
  </div>
</body>

</html>
